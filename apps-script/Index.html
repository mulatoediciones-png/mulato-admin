<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#161a22;--mut:#667085;--bd:#e2e5ec;--ac:#1f3864;--act:#fff;--ok:#157347;--bad:#b42318;--warn:#b45309;--in:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b23;--tx:#e8eaee;--mut:#98a2b3;--bd:#2a303b;--ac:#7fa6ff;--act:#0e1116;--ok:#4cc38a;--bad:#ff7b72;--warn:#f0b455;--in:#1d2433}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding-bottom:76px}
main{max-width:720px;margin:0 auto;padding:12px 16px}h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:22px 0 8px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}
header b{font-size:18px}#estado{font-size:12px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;z-index:6}
nav button{flex:1;min-width:72px;background:none;border:0;color:var(--mut);padding:10px 4px;font-size:12px;min-height:56px}nav button.on{color:var(--ac);font-weight:700;border-top:2px solid var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:0}.row>span:first-child{color:var(--mut)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.kpi small{color:var(--mut);display:block}.kpi strong{font-size:24px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.top{display:flex;justify-content:space-between;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.w{grid-column:1/-1}label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select{font:inherit;width:100%;border-radius:8px;border:1px solid var(--bd);padding:9px 10px;background:var(--in);color:var(--tx);min-height:42px}
button.b{font:inherit;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--act);font-weight:600;padding:9px 14px;min-height:42px}button.s{background:transparent;color:var(--ac)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.pill{font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--mut)}
#msg{position:fixed;left:16px;right:16px;bottom:70px;max-width:560px;margin:auto;background:var(--tx);color:var(--bg);border-radius:10px;padding:10px 14px;z-index:9;display:none}
</style></head><body>
<header><b>Mulato Admin <span id="mes" class="mut" style="font-weight:400"></span></b><span id="estado"></span></header>
<main id="vista">Cargando…</main><nav id="tabs"></nav><div id="msg"></div>
<script>
var D=null,tab='resumen',busy=false;
var TABS=[['resumen','Resumen'],['cobros','Cobros'],['sueldos','Sueldos'],['clientes','Clientes'],['gastos','Gastos'],['ajustes','Ajustes']];
var PLANES=['Emprendedor','Impulso','Expansión','Escala','Personalizado'];
var $=function(i){return document.getElementById(i)};
function m(x){x=Math.round(Number(x)||0);return(x<0?'-':'')+'$'+Math.abs(x).toLocaleString('en-US')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=$('msg');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3500)}
function row(a,b){return'<div class="row"><span>'+a+'</span><b>'+b+'</b></div>'}
function kpi(t,v,c){return'<div class="kpi"><small>'+t+'</small><strong class="'+(c||'')+'">'+v+'</strong></div>'}
function fld(l,h,w){return'<div'+(w?' class="w"':'')+'><label>'+l+'</label>'+h+'</div>'}
function inp(h,f,c,v,num){return'<input data-h="'+h+'" data-f="'+f+'" data-c="'+c+'"'+(num?' data-n="1" inputmode="decimal"':'')+' value="'+esc(v)+'">'}
function sel(h,f,c,v,o){return'<select data-h="'+h+'" data-f="'+f+'" data-c="'+c+'">'+o.map(function(x){return'<option'+(x==v?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>'}
var V={};
V.resumen=function(){var r=D.r;return'<div class="kpis">'+kpi('Falta cobrar',m(r.faltaCobrar))+kpi('Falta pagar a la gente',m(r.faltaPagar))+kpi('Ganancia del mes',m(r.ganancia),r.ganancia<0?'bad':'ok')+kpi('Dinero en caja',m(r.caja),r.caja<0?'bad':'')+'</div>'
 +'<h2>Cobros</h2><div class="card">'+row('Total a cobrar',m(r.cobrar))+row('Ya cobrado',m(r.cobrado))+'</div>'
 +'<h2>Pagos del mes</h2><div class="card">'+row('Sueldos (sin bono)',m(r.sueldos))+row('Herramientas y viáticos',m(r.gastos))+row('Total a pagar (sin bono)',m(r.pagar))+'</div>'
 +'<h2>Ganancia</h2><div class="card">'+row('Ganancia del mes',m(r.ganancia))+row('Se queda la agencia ('+Math.round(D.pct*100)+'%)',m(r.agencia))+row('Bono de cada CEO',m(r.bonoCada))+'</div>'
 +'<h2>Salud del negocio</h2><div class="card">'+row('Ganancia sobre lo cobrado (meta 15%+)','<span class="'+(r.margen>=.15?'ok':'warn')+'">'+Math.round(r.margen*100)+'%</span>')+row('Sueldos sobre lo cobrado (meta 60%-)','<span class="'+(r.ratio<=.6?'ok':'warn')+'">'+Math.round(r.ratio*100)+'%</span>')+'</div>'};
V.cobros=function(){var h='<div class="kpis">'+kpi('Total a cobrar',m(D.r.cobrar))+kpi('Falta cobrar',m(D.r.faltaCobrar),D.r.faltaCobrar>0?'warn':'ok')+'</div>';
 D.cobros.forEach(function(c){h+='<div class="card"><div class="top"><b>'+esc(c.nombre)+'</b><span class="'+(c.falta>0?'warn':'ok')+'">'+(c.falta>0?'falta '+m(c.falta):'cobrado ✓')+'</span></div><div class="mut">'+esc(c.plan)+' · '+esc(c.fecha)+' · '+esc(c.forma)+'</div><div class="mut">'+m(c.precio)+(c.viatico?' + viático '+m(c.viatico):'')+' = <b>'+m(c.total)+'</b></div><div class="grid">'+fld('Ya cobrado',inp('Cobros',c.row,5,c.cobrado||0,1))+'<div style="align-self:end"><button class="b s" data-full="Cobros,'+c.row+',5,'+c.total+'">Cobrado completo</button></div></div></div>'});return h};
V.sueldos=function(){var h='<div class="kpis">'+kpi('Total del equipo',m(D.r.sueldos+D.r.bono))+kpi('Falta pagar',m(D.r.faltaPagar),D.r.faltaPagar>0?'warn':'ok')+'</div>';
 D.sueldos.forEach(function(p){h+='<div class="card"><div class="top"><b>'+esc(p.nombre)+'</b><span class="'+(p.falta>0?'warn':'ok')+'">'+(p.falta>0?'falta '+m(p.falta):'pagado ✓')+'</span></div><div class="mut">'+esc(p.cargo)+'</div><div class="mut">Fijo '+m(p.fijo)+(p.cuentas?' + cuentas '+m(p.cuentas):'')+(p.bono?' + bono '+m(p.bono):'')+' = <b>'+m(p.total)+'</b></div><div class="grid">'+fld('Ya pagado',inp('Sueldos',p.row,9,p.pagado||0,1))+'<div style="align-self:end"><button class="b s" data-full="Sueldos,'+p.row+',9,'+p.total+'">Pagado completo</button></div></div></div>'});
 return h+'<div class="acts"><button class="b s" data-add="persona">+ Agregar persona</button></div><p class="mut">Los sueldos por cuenta y el bono se calculan solos. Para cambiar el fijo de alguien o su fórmula, edita la hoja.</p>'};
V.clientes=function(){var h='';D.clientes.forEach(function(c){if(!c.nombre)return;h+='<details class="card"><summary><b>'+esc(c.nombre)+'</b> <span class="pill">'+esc(c.plan)+'</span> <span class="pill">'+m(c.precio)+'</span>'+(c.estado!=='Activo'?' <span class="pill">inactivo</span>':'')+'</summary><div class="grid">'
 +fld('Cliente',inp('Clientes',c.row,1,c.nombre))+fld('Plan',sel('Clientes',c.row,2,c.plan,PLANES))+fld('Precio acordado',inp('Clientes',c.row,3,c.precio,1))+fld('Pautas del mes',inp('Clientes',c.row,5,c.pautas||0,1))
 +fld('Cobra viático',sel('Clientes',c.row,4,c.viatico,['Sí','No']))+fld('Estado',sel('Clientes',c.row,9,c.estado,['Activo','Inactivo']))
 +fld('Forma de pago',sel('Clientes',c.row,7,c.forma,['Bolívares a tasa euro','Bolívares a tasa BCV','Efectivo','Divisas (USDT)','Otro']))+fld('Fecha límite',sel('Clientes',c.row,8,c.fecha,['Del 1 al 5','Último día del mes','Por acordar']))
 +fld('Observación',inp('Clientes',c.row,12,c.obs),1)+'</div></details>'});
 return h+'<div class="acts"><button class="b s" data-add="cliente">+ Agregar cliente</button></div>'};
V.gastos=function(){var h='<div class="kpis">'+kpi('Gastos del mes',m(D.r.gastos))+'</div>';
 D.gastos.forEach(function(g){h+='<div class="card"><div class="grid">'+fld('Concepto',inp('Gastos',g.row,1,g.concepto),1)+fld('Monto del mes',inp('Gastos',g.row,2,g.monto||0,1))+fld('Ya pagado',inp('Gastos',g.row,3,g.pagado||0,1))+'</div></div>'});return h};
V.ajustes=function(){return'<div class="card"><div class="grid">'+fld('Mes en curso',inp('Resumen',2,2,D.mes))+fld('% que se queda la agencia (0.6 = 60%)',inp('Resumen',16,2,D.pct,1))+'</div></div>'
 +'<h2>Avisos a Telegram ahora</h2><div class="acts"><button class="b s" data-fn="avisoCobros">Cobros</button><button class="b s" data-fn="avisoPagos">Pagos</button><button class="b s" data-fn="cierreDeMes">Resumen</button></div>'
 +'<h2>Mes nuevo</h2><div class="card"><p class="mut">Guarda el mes en pestañas de historial dentro de la hoja, deja cobros y pagos en cero y abre el siguiente. Pasa solo el día 1.</p><button class="b s" data-fn="abrirMesNuevo" data-confirm="¿Cerrar '+esc(D.mes)+' y abrir el siguiente?">Cerrar '+esc(D.mes)+' ahora</button></div>'
 +'<p class="mut">Precios, pagos por plan y tabulador se editan en la hoja de Google (pestañas Ajustes y Tabulador).</p>'};
function render(){if(!D)return;$('mes').textContent='· '+D.mes;$('tabs').innerHTML=TABS.map(function(t){return'<button data-tab="'+t[0]+'"'+(t[0]===tab?' class="on"':'')+'>'+t[1]+'</button>'}).join('');$('vista').innerHTML=V[tab]()}
function ok(d){busy=false;D=d;$('estado').textContent='● Guardado';render()}
function fail(e){busy=false;$('estado').textContent='Error';toast(String(e.message||e))}
function save(arr){busy=true;$('estado').textContent='Guardando…';google.script.run.withSuccessHandler(ok).withFailureHandler(fail).guardar(arr)}
document.addEventListener('change',function(e){var t=e.target;if(!t.dataset||!t.dataset.h)return;var v=t.dataset.n?Number(String(t.value).replace(',','.'))||0:t.value;save([{hoja:t.dataset.h,fila:Number(t.dataset.f),col:Number(t.dataset.c),valor:v}])});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset;
 if(d.tab){tab=d.tab;render();scrollTo(0,0)}
 else if(d.full){var a=d.full.split(',');save([{hoja:a[0],fila:Number(a[1]),col:Number(a[2]),valor:Number(a[3])}])}
 else if(d.add){busy=true;google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[d.add==='cliente'?'agregarCliente':'agregarPersona']()}
 else if(d.fn){if(d.confirm&&!confirm(d.confirm))return;toast('Enviando…');google.script.run.withSuccessHandler(function(r){toast(r||'Listo');cargar()}).withFailureHandler(fail)[d.fn]()}});
$('estado').onclick=function(){cargar()};
function cargar(){$('estado').textContent='Cargando…';google.script.run.withSuccessHandler(function(d){D=d;$('estado').textContent='● Actualizado';render()}).withFailureHandler(fail).getData()}
cargar();
</script></body></html>
