<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f3864">
<title>Mulato Admin</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#161a22;--mut:#667085;--bd:#e2e5ec;--ac:#1f3864;--act:#fff;--ok:#157347;--bad:#b42318;--warn:#b45309;--in:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b23;--tx:#e8eaee;--mut:#98a2b3;--bd:#2a303b;--ac:#7fa6ff;--act:#0e1116;--ok:#4cc38a;--bad:#ff7b72;--warn:#f0b455;--in:#1d2433}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
main{max-width:720px;margin:0 auto;padding:12px 16px}
h1{font-size:18px;margin:0}h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:22px 0 8px}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd)}
header div{max-width:720px}
#estado{font-size:12px;color:var(--mut)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;z-index:6}
nav button{flex:1;min-width:76px;background:none;border:0;color:var(--mut);padding:10px 4px;font-size:12px;min-height:56px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700;border-top:2px solid var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}.row>span:first-child{color:var(--mut)}.row b{font-variant-numeric:tabular-nums;text-align:right}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi small{color:var(--mut);display:block}.kpi strong{font-size:24px;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.top b{font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.grid .w{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select,textarea{font:inherit;width:100%;border-radius:8px;border:1px solid var(--bd);padding:9px 10px;background:var(--in);color:var(--tx);min-height:42px}
input[type=checkbox]{width:22px;min-height:22px;height:22px}
button.b{font:inherit;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--act);font-weight:600;padding:9px 14px;min-height:42px;cursor:pointer}
button.s{background:transparent;color:var(--ac)}button.d{background:transparent;color:var(--bad);border-color:var(--bd)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}th{color:var(--mut);font-weight:600}
td input{padding:6px;min-height:34px}
#msg{position:fixed;left:16px;right:16px;bottom:70px;max-width:560px;margin:auto;background:var(--tx);color:var(--bg);border-radius:10px;padding:10px 14px;z-index:9;display:none}
</style>
</head>
<body>
<header><h1>Mulato Admin <span id="mes" class="mut" style="font-weight:400"></span></h1><span id="estado"></span></header>
<main id="vista"></main>
<nav id="tabs"></nav>
<div id="msg" role="status"></div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
